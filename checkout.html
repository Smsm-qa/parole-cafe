<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الدفع - PAROLE Cafe</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2C221E;
            --accent: #C5A059;
            --accent-hover: #b38f4d;
            --bg-light: #F9F8F6;
            --white: #FFFFFF;
            --text-dark: #2C221E;
            --text-gray: #666666;
            --border-color: #E2DDD9;
            --error: #d9534f;
            --success: #5cb85c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary);
            color: var(--white);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: var(--white);
            text-decoration: none;
            font-weight: 700;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .checkout-form-section, .order-summary-section {
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            color: var(--primary);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--accent);
        }

        input.error {
            border-color: var(--error);
        }

        .fulfillment-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid var(--border-color);
            background: var(--bg-light);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .summary-total {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--primary);
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1.5rem;
            text-align: center;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .btn-submit:disabled {
            background: var(--border-color);
            cursor: not-allowed;
        }

        /* Toast notifications */
        #toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .toast {
            background: var(--primary);
            color: var(--white);
            padding: 10px 20px;
            border-radius: 6px;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .toast.show {
            opacity: 1;
        }

        .toast.error { background: var(--error); }
        .toast.success { background: var(--success); }

        /* Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
            z-index: 2000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal.active {
            opacity: 1; pointer-events: auto;
        }
        .modal-content {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 12px;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        .modal-content i {
            font-size: 3rem;
            color: var(--success);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html">PAROLE Cafe</a>
        <span>إتمام الطلب بأمان</span>
    </header>

    <div class="container">
        <!-- بيانات العميل والتوصيل -->
        <div class="checkout-form-section">
            <h2>طريقة الاستلام</h2>
            <div class="fulfillment-tabs">
                <button type="button" class="tab-btn active" onclick="setFulfillmentMode('delivery')">توصيل للمنزل</button>
                <button type="button" class="tab-btn" onclick="setFulfillmentMode('dine_in')">محلي (داخل الكافيه)</button>
            </div>

            <form id="checkoutForm" onsubmit="executeSecureOrder(event)">
                <h2>بيانات العميل</h2>
                <div class="form-group">
                    <label for="fullName">الاسم الثلاثي</label>
                    <input type="text" id="fullName" required placeholder="أدخل اسمك الكامل">
                </div>
                <div class="form-group">
                    <label for="phone">رقم الجوال</label>
                    <div style="display: flex; gap: 5px; align-items: center;">
                        <span style="padding: 0.8rem; background: #eee; border-radius: 8px; border: 1px solid var(--border-color);">+974</span>
                        <input type="tel" id="phone" required placeholder="33xxxxxx" maxlength="8">
                    </div>
                </div>

                <!-- حقول التوصيل -->
                <div id="deliveryFields">
                    <h2>عنوان التوصيل</h2>
                    <div class="form-group">
                        <label for="addrCity">المنطقة / المدينة</label>
                        <input type="text" id="addrCity" placeholder="الدوحة، لوسيل...">
                    </div>
                    <div class="form-group">
                        <label for="addrStreet">الشارع</label>
                        <input type="text" id="addrStreet" placeholder="اسم الشارع">
                    </div>
                    <div class="form-group">
                        <label for="addrBuilding">رقم المبنى / البيت</label>
                        <input type="text" id="addrBuilding" placeholder="رقم المبنى">
                    </div>
                    <div class="form-group">
                        <label for="addrUnit">رقم الشقة / الوحدة (اختياري)</label>
                        <input type="text" id="addrUnit" placeholder="رقم الشقة">
                    </div>
                    <div class="form-group">
                        <label for="addrLandmark">علامة مميزة (اختياري)</label>
                        <input type="text" id="addrLandmark" placeholder="قريب من...">
                    </div>
                </div>

                <!-- حقول المحلي -->
                <div id="dineInFields" style="display: none;">
                    <h2>تفاصيل الطاولة</h2>
                    <div class="form-group">
                        <label for="tableNumber">رقم الطاولة</label>
                        <input type="text" id="tableNumber" placeholder="أدخل رقم الطاولة الجالس عليها">
                    </div>
                </div>

                <div class="form-group">
                    <label for="orderNotes">ملاحظات الطلب (اختياري)</label>
                    <textarea id="orderNotes" rows="2" placeholder="ملاحظات إضافية على الطلب..."></textarea>
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="saveInfoCheckbox" style="width: auto;">
                    <label for="saveInfoCheckbox" style="margin-bottom: 0; cursor: pointer;">حفظ بياناتي لطلباتي القادمة</label>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">تأكيد وإرسال الطلب</button>
            </form>
        </div>

        <!-- ملخص السلة -->
        <div class="order-summary-section">
            <h2>ملخص الطلب</h2>
            <div id="summaryItemsContainer">
                <!-- يتم تعبئتها ديناميكياً -->
            </div>
            <div class="summary-item">
                <span>المجموع الفرعي</span>
                <span id="summarySubtotal">0.00 ر.س</span>
            </div>
            <div class="summary-item" id="deliveryFeeRow">
                <span>رسوم التوصيل</span>
                <span id="summaryDeliveryFee">18.00 ر.س</span>
            </div>
            <div class="summary-item" id="discountRow" style="display: none; color: var(--success);">
                <span>الخصم</span>
                <span id="summaryDiscount">0.00 ر.س</span>
            </div>
            <div class="summary-total">
                <span>الإجمالي النهائي</span>
                <span id="summaryGrandTotal">0.00 ر.س</span>
            </div>
        </div>
    </div>

    <!-- نافذة النجاح (Modal) -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <i class="fa-solid fa-circle-check"></i>
            <h2>تم استلام طلبك بنجاح!</h2>
            <p>رقم طلبك هو: <strong id="modalOrderIdText" style="color: var(--accent);"></strong></p>
            <p style="margin-top: 15px; color: var(--text-gray); font-size: 0.9rem;">سيتم تحويلك للصفحة الرئيسية تلقائياً...</p>
        </div>
    </div>

    <div id="toast-container"></div>

    <!-- ربط Firebase وتهيئة الكود الآمن -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, collection, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForParoleCafe",
            authDomain: "parole-cafe.firebaseapp.com",
            projectId: "parole-cafe",
            storageBucket: "parole-cafe.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentFulfillmentMode = 'delivery';
        let isSubmittingOrder = false;
        let appliedCouponCode = '';
        const FREE_SHIPPING_THRESHOLD = 150;

        const translations = {
            ar: {
                rateLimitError: "الرجاء الانتظار قليلاً قبل إرسال طلب آخر.",
                cartEmptyDesc: "سلة المشتريات فارغة!",
                errorName: "الرجاء إدخال الاسم الثلاثي الصحيح.",
                errorPhone: "رقم الجوال يجب أن يتكون من 8 أرقام ويبدأ بـ 3 أو 5 أو 6 أو 7.",
                errorAddress: "الرجاء إكمال بيانات عنوان التوصيل.",
                errorTable: "الرجاء إدخال رقم الطاولة.",
                processingOrder: "جاري تأكيد الطلب...",
                submitBtn: "تأكيد وإرسال الطلب"
            }
        };
        const currentLang = 'ar';

        window.setFulfillmentMode = function(mode) {
            currentFulfillmentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (mode === 'delivery') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('deliveryFields').style.display = 'block';
                document.getElementById('dineInFields').style.display = 'none';
                document.getElementById('deliveryFeeRow').style.display = 'flex';
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('deliveryFields').style.display = 'none';
                document.getElementById('dineInFields').style.display = 'block';
                document.getElementById('deliveryFeeRow').style.display = 'none';
            }
            renderSummary();
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function checkRateLimit() {
            const lastTime = localStorage.getItem('parole_last_order_time');
            if (lastTime && (Date.now() - parseInt(lastTime) < 10000)) {
                return false;
            }
            return true;
        }

        function validateName(name) {
            const parts = name.trim().split(/\s+/);
            return parts.length >= 2 && name.length >= 5;
        }

        function validateQatariPhone(phone) {
            return /^[3567]\d{7}$/.test(phone);
        }

        function renderSummary() {
            let cart = [];
            try {
                cart = JSON.parse(localStorage.getItem('parole_cart')) || [];
            } catch(e) { cart = []; }

            const container = document.getElementById('summaryItemsContainer');
            container.innerHTML = '';

            let subtotal = 0;
            if (cart.length === 0) {
                container.innerHTML = '<p style="color: var(--text-gray); text-align: center;">السلة فارغة</p>';
            } else {
                cart.forEach(item => {
                    const price = parseFloat(item.price) || 0;
                    const qty = parseInt(item.quantity) || 1;
                    subtotal += price * qty;

                    const div = document.createElement('div');
                    div.className = 'summary-item';
                    div.innerHTML = `<span>${item.name || 'منتج'} (x${qty})</span><span>${(price * qty).toFixed(2)} ر.س</span>`;
                    container.appendChild(div);
                });
            }

            const deliveryFee = currentFulfillmentMode === 'delivery' ? (subtotal >= FREE_SHIPPING_THRESHOLD || subtotal === 0 ? 0 : 18.00) : 0;
            let discount = 0;
            
            const grandTotal = Math.max(0, subtotal + deliveryFee - discount);

            document.getElementById('summarySubtotal').textContent = subtotal.toFixed(2) + ' ر.س';
            document.getElementById('summaryDeliveryFee').textContent = deliveryFee.toFixed(2) + ' ر.س';
            document.getElementById('summaryGrandTotal').textContent = grandTotal.toFixed(2) + ' ر.س';
        }

        // دالة إتمام الطلب الآمنة والمحدثة بالكامل مع معالجة خطأ الـ indexOf
        window.executeSecureOrder = async function(e) {
            e.preventDefault();
            if (isSubmittingOrder) return;

            if (!checkRateLimit()) {
                showToast(translations[currentLang].rateLimitError, 'error');
                return;
            }

            let cart = [];
            try { 
                const rawCart = localStorage.getItem('parole_cart');
                cart = rawCart ? JSON.parse(rawCart) : []; 
            } catch(err) { cart = []; }

            if (!Array.isArray(cart) || cart.length === 0) {
                showToast(translations[currentLang].cartEmptyDesc, 'error');
                setTimeout(() => window.location.href = 'shop.html', 1500);
                return;
            }

            const fullName = document.getElementById('fullName').value.replace(/\s+/g, ' ').trim();
            const rawPhone = document.getElementById('phone').value.trim();
            const phone = '+974' + rawPhone;
            const orderNotes = document.getElementById('orderNotes').value.replace(/\s+/g, ' ').trim().substring(0, 200);

            if (!validateName(fullName)) {
                document.getElementById('fullName').classList.add('error');
                showToast(translations[currentLang].errorName, 'error');
                return;
            }
            document.getElementById('fullName').classList.remove('error');

            if (!validateQatariPhone(rawPhone)) {
                document.getElementById('phone').classList.add('error');
                showToast(translations[currentLang].errorPhone, 'error');
                return;
            }
            document.getElementById('phone').classList.remove('error');

            let addressData = {};
            let tableNum = '';

            if (currentFulfillmentMode === 'delivery') {
                const city = document.getElementById('addrCity').value.trim();
                const street = document.getElementById('addrStreet').value.trim();
                const building = document.getElementById('addrBuilding').value.trim();
                if (!city || !street || !building) {
                    showToast(translations[currentLang].errorAddress, 'error');
                    return;
                }
                addressData = { city, street, building, unit: document.getElementById('addrUnit').value.trim(), landmark: document.getElementById('addrLandmark').value.trim() };
            } else if (currentFulfillmentMode === 'dine_in') {
                tableNum = document.getElementById('tableNumber').value.trim();
                if (!tableNum) {
                    showToast(translations[currentLang].errorTable, 'error');
                    return;
                }
            }

            if (document.getElementById('saveInfoCheckbox').checked) {
                localStorage.setItem('parole_saved_customer', JSON.stringify({ fullName, phone: rawPhone, ...addressData, tableNumber: tableNum }));
            }

            isSubmittingOrder = true;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${translations[currentLang].processingOrder}`;

            try {
                let finalOrderId = '';
                await runTransaction(db, async (transaction) => {
                    let serverSubtotal = 0;
                    let validatedItems = [];

                    for (const item of cart) {
                        const qty = Math.min(99, Math.max(1, parseInt(item.quantity) || 1));
                        
                        // معالجة آمنة جداً لمعرف المنتج لمنع خطأ indexOf
                        let pId = item.id;
                        if (typeof pId === 'object' && pId !== null) {
                            pId = pId.id || pId._id || '';
                        }
                        pId = String(pId || '').trim();

                        if (!pId) {
                            throw new Error("معرف المنتج غير صالح في السلة.");
                        }

                        const productRef = doc(db, "products", pId);
                        const productSnap = await transaction.get(productRef);
                        
                        if (!productSnap.exists()) {
                            throw new Error(`عذراً، أحد المنتجات لم يعد متوفراً في قاعدة البيانات.`);
                        }

                        const productData = productSnap.data();
                        
                        if (productData.active === false) {
                            throw new Error(`عذراً، المنتج (${productData.name || 'غير معروف'}) غير متاح حالياً.`);
                        }

                        const realPrice = parseFloat(productData.price) || 0;
                        if (realPrice <= 0) {
                            throw new Error("خطأ في تسعير المنتج.");
                        }

                        const availableStock = productData.stock !== undefined ? parseInt(productData.stock) : 999;
                        if (availableStock < qty) {
                            throw new Error(`عذراً، الكمية المطلوبة غير متوفرة للمنتج.`);
                        }

                        serverSubtotal += realPrice * qty;
                        validatedItems.push({
                            id: pId,
                            name: String(productData.name || item.name || 'منتج'),
                            price: realPrice,
                            quantity: qty
                        });

                        transaction.update(productRef, { stock: availableStock - qty });
                    }

                    let serverDeliveryFee = currentFulfillmentMode === 'delivery' ? (serverSubtotal >= FREE_SHIPPING_THRESHOLD ? 0 : 18.00) : 0;
                    let serverDiscount = 0;

                    const serverGrandTotal = Math.max(0, serverSubtotal + serverDeliveryFee - serverDiscount);
                    
                    if (serverGrandTotal <= 0 || serverGrandTotal > 5000) {
                        throw new Error("قيمة الطلب غير منطقية أو تتجاوز الحد المسموح.");
                    }

                    const newOrderRef = doc(collection(db, "orders"));
                    finalOrderId = 'PRL-' + newOrderRef.id.substring(0, 6).toUpperCase();
                    
                    const secureOrder = {
                        orderId: finalOrderId,
                        createdAt: serverTimestamp(),
                        customerName: fullName,
                        phone: phone,
                        notes: orderNotes,
                        fulfillmentType: currentFulfillmentMode,
                        tableNumber: tableNum,
                        address: addressData,
                        items: validatedItems,
                        subtotal: serverSubtotal,
                        deliveryFee: serverDeliveryFee,
                        discount: serverDiscount,
                        total: serverGrandTotal,
                        status: 'Pending',
                        currency: 'QAR'
                    };

                    transaction.set(newOrderRef, secureOrder);
                });

                localStorage.setItem('parole_last_order_time', Date.now().toString());
                localStorage.removeItem('parole_cart');
                localStorage.removeItem('parole_applied_coupon_code');
                
                document.getElementById('modalOrderIdText').textContent = finalOrderId;
                document.getElementById('successModal').classList.add('active');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 5000);

            } catch (error) {
                console.error("Secure Order Error: ", error);
                showToast(error.message || "حدث خطأ أثناء معالجة الطلب.", 'error');
                isSubmittingOrder = false;
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>${translations[currentLang].submitBtn}</span>`;
            }
        };

        // تحميل الملخص عند فتح الصفحة
        renderSummary();
    </script>
</body>
</html>
