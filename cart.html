<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الدفع الآمن | PAROLE Cafe</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f9d976;
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f9d976 100%);
            --dark-bg: #050505;
            --card-bg: rgba(20, 20, 20, 0.95);
            --border-color: rgba(212, 175, 55, 0.2);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --success: #2ecc71;
            --danger: #e74c3c;
            --ease-out-quad: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--dark-bg); color: var(--text-main); line-height: 1.6; direction: rtl; text-align: right; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(10px); position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; border-bottom: 1px solid var(--border-color); }
        .nav-container { max-width: 1300px; margin: 0 auto; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        
        main { flex: 1; padding: 110px 25px 60px; max-width: 1300px; margin: 0 auto; width: 100%; }
        .section-header { text-align: center; margin-bottom: 40px; }
        .section-header h1 { font-size: 28px; color: var(--gold); font-weight: 800; margin-bottom: 8px; }
        .section-header p { color: var(--text-muted); font-size: 14px; }

        .checkout-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 30px; align-items: start; }
        @media(max-width: 900px) { .checkout-grid { grid-template-columns: 1fr; } }

        .checkout-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 25px; margin-bottom: 20px; }
        .checkout-card h3 { font-size: 18px; color: var(--gold); margin-bottom: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px 15px; background: var(--dark-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 12px; font-size: 14px; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--gold); }

        .summary-item { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .summary-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-color); background: #111; }
        .summary-info { flex: 1; }
        .summary-info h4 { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 2px; }
        .summary-info p { font-size: 12px; color: var(--text-muted); }

        .summary-totals { margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 15px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: var(--text-muted); }
        .summary-row strong { color: var(--text-main); }
        .total-price { color: var(--gold); font-weight: 800; font-size: 20px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn-submit-order { background: var(--gold-gradient); color: #000; padding: 16px; width: 100%; border-radius: 14px; font-weight: 800; font-size: 16px; border: none; cursor: pointer; transition: var(--ease-out-quad); box-shadow: 0 4px 15px rgba(212,175,55,0.3); margin-top: 20px; }
        .btn-submit-order:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(212,175,55,0.4); }
        .btn-submit-order:disabled { opacity: 0.6; cursor: not-allowed; }

        #checkout-loader { text-align: center; padding: 40px; color: var(--gold); font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">PAROLE Cafe</a>
            <a href="cart.html" style="color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-arrow-right"></i> العودة للسلة
            </a>
        </div>
    </header>

    <main>
        <div class="section-header">
            <h1>إتمام الدفع الآمن</h1>
            <p>أدخل بيانات التوصيل الخاصة بك لتأكيد طلبك في المملكة العربية السعودية.</p>
        </div>

        <div id="checkout-loader">
            <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
            <p style="margin-top: 10px;">جاري تأمين الأسعار والتحقق من الخادم...</p>
        </div>

        <div class="checkout-grid" id="checkoutContent" style="display: none;">
            <!-- نموذج بيانات العميل -->
            <div class="checkout-card">
                <h3><i class="fa-solid fa-user-shield"></i> بيانات التوصيل</h3>
                <form id="orderForm" onsubmit="event.preventDefault(); submitSecureOrder();">
                    <div class="form-group">
                        <label>الاسم الكامل</label>
                        <input type="text" id="customerName" required placeholder="أدخل اسمك الكريم">
                    </div>
                    <div class="form-group">
                        <label>رقم الجوال (السعودية)</label>
                        <input type="tel" id="customerPhone" required placeholder="05xxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label>عنوان التوصيل (المدينة، الحي، الشارع)</label>
                        <textarea id="customerAddress" rows="3" required placeholder="مثال: الرياض، حي الملقا، شارع الأمير محمد..."></textarea>
                    </div>
                    <button type="submit" id="submitOrderBtn" class="btn-submit-order">
                        <i class="fa-solid fa-check-circle"></i> تأكيد وإرسال الطلب نهائياً
                    </button>
                </form>
            </div>

            <!-- ملخص الطلب المؤكد من الخادم -->
            <div class="checkout-card">
                <h3><i class="fa-solid fa-receipt"></i> ملخص الطلب المؤكد</h3>
                <div id="verifiedItemsList"></div>
                <div class="summary-totals">
                    <div class="summary-row"><span>المجموع الفرعي:</span> <strong id="vSubtotal">0.00 ر.س</strong></div>
                    <div class="summary-row"><span>رسوم التوصيل:</span> <strong id="vShipping">18.00 ر.س</strong></div>
                    <div class="summary-row" id="vDiscountRow" style="display: none; color: #2ecc71;"><span>الخصم (<span id="vCouponName"></span>):</span> <strong id="vDiscount">0.00 ر.س</strong></div>
                    <div class="summary-row" style="border-top: 1px solid var(--border-color); padding-top: 12px; font-size: 16px;">
                        <span>الإجمالي النهائي:</span>
                        <span class="total-price" id="vTotal">0.00 ر.س</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD13FuUUPll0IHWJ2Oc6arwMjnThKObAjg",
            authDomain: "parole-cafe.firebaseapp.com",
            databaseURL: "https://parole-cafe-default-rtdb.firebaseio.com",
            projectId: "parole-cafe",
            storageBucket: "parole-cafe.firebasestorage.app",
            messagingSenderId: "109893830029",
            appId: "1:109893830029:web:941d8e5f2cf84ae51d29c4",
            measurementId: "G-0653WGC237"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        const FREE_SHIPPING_THRESHOLD = 150.00;
        const BASE_SHIPPING_FEE = 18.00;

        let verifiedCheckoutData = {
            items: [],
            subtotal: 0,
            shipping: BASE_SHIPPING_FEE,
            discount: 0,
            total: 0,
            couponCode: null
        };

        // دالة آمنة للتحقق من صحة روابط الصور ومنع حقن كود خبيث
        function sanitizeImageURL(url) {
            if (!url || typeof url !== 'string') return 'assets/default-product.webp';
            const trimmed = url.trim();
            if (trimmed.startsWith('https://') || trimmed.startsWith('assets/') || trimmed.startsWith('/')) {
                return trimmed;
            }
            return 'assets/default-product.webp';
        }

        async function verifyAndLoadCheckout() {
            const loader = document.getElementById('checkout-loader');
            const content = document.getElementById('checkoutContent');

            try {
                const rawCart = JSON.parse(localStorage.getItem('parole_cart')) || [];
                if (!Array.isArray(rawCart) || rawCart.length === 0) {
                    alert('سلة المشتريات فارغة!');
                    window.location.href = 'cart.html';
                    return;
                }

                let itemsList = [];
                let calculatedSubtotal = 0;

                // إعادة التحقق التام من كل منتج من Firestore ومنع التلاعب بالكميات أو الأسعار
                for (const cartItem of rawCart) {
                    if (!cartItem || !cartItem.id) continue;
                    
                    const docRef = await db.collection('products').doc(cartItem.id).get();
                    if (!docRef.exists) throw new Error("عذراً، أحد المنتجات لم يعد متوفراً في المتجر.");
                    
                    const prodData = docRef.data();
                    if (prodData.isAvailable === false) {
                        throw new Error(`المنتج "${prodData.name || prodData.nameAr || 'غير معروف'}" غير متوفر حالياً.`);
                    }

                    // فرض حدود صارمة جداً للكمية لمنع القيم الاحتيالية
                    let qty = Number(cartItem.quantity) || 1;
                    qty = Math.max(1, Math.min(qty, 20));

                    const serverPrice = Number(prodData.price) || 0;
                    const itemTotal = serverPrice * qty;
                    calculatedSubtotal += itemTotal;

                    itemsList.push({
                        id: docRef.id,
                        name: prodData.name || prodData.nameAr || 'منتج',
                        price: serverPrice,
                        quantity: qty,
                        image: sanitizeImageURL(prodData.image || prodData.img),
                        total: itemTotal
                    });
                }

                if (itemsList.length === 0) {
                    throw new Error("سلة المشتريات لا تحتوي على منتجات صالحة.");
                }

                // التحقق من الكوبون وتطبيق شروطه عبر الخادم بدقة
                let discountVal = 0;
                let appliedCoupon = localStorage.getItem('parole_applied_coupon_code');
                let validCouponCode = null;

                if (appliedCoupon && calculatedSubtotal > 0) {
                    const couponSnap = await db.collection('coupons').doc(appliedCoupon.toUpperCase().trim()).get();
                    if (couponSnap.exists) {
                        const cData = couponSnap.data();
                        const now = new Date();
                        let isValid = cData.isActive !== false;
                        
                        if (cData.expiryDate) {
                            const exp = cData.expiryDate.toDate ? cData.expiryDate.toDate() : new Date(cData.expiryDate);
                            if (now > exp) isValid = false;
                        }
                        if (cData.minSpend && calculatedSubtotal < Number(cData.minSpend)) {
                            isValid = false;
                        }

                        if (isValid) {
                            validCouponCode = cData.code || appliedCoupon.toUpperCase();
                            let rawVal = Number(cData.value) || 0;
                            if (rawVal <= 100 && rawVal > 0 && !cData.isFixed) {
                                discountVal = calculatedSubtotal * (rawVal / 100);
                            } else {
                                discountVal = rawVal;
                            }
                            if (discountVal > calculatedSubtotal) discountVal = calculatedSubtotal;
                        }
                    }
                } else if (calculatedSubtotal === 0) {
                    localStorage.removeItem('parole_applied_coupon_code');
                }

                let shippingFee = calculatedSubtotal >= FREE_SHIPPING_THRESHOLD ? 0.00 : BASE_SHIPPING_FEE;
                let finalGrandTotal = calculatedSubtotal + shippingFee - discountVal;
                if (finalGrandTotal < 0) finalGrandTotal = 0;

                verifiedCheckoutData = {
                    items: itemsList,
                    subtotal: calculatedSubtotal,
                    shipping: shippingFee,
                    discount: discountVal,
                    total: finalGrandTotal,
                    couponCode: validCouponCode
                };

                renderVerifiedUI();
                loader.style.display = 'none';
                content.style.display = 'grid';

            } catch (err) {
                console.error("Checkout Verification Error:", err);
                alert("خطأ في التحقق من الطلب: " + err.message);
                window.location.href = 'cart.html';
            }
        }

        function renderVerifiedUI() {
            const listEl = document.getElementById('verifiedItemsList');
            
            // استخدام textContent عبر بناء العناصر بأمان لمنع أي XSS
            listEl.innerHTML = '';
            verifiedCheckoutData.items.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'summary-item';

                const img = document.createElement('img');
                img.src = item.image;
                img.className = 'summary-img';
                img.onerror = () => { img.src = 'assets/default-product.webp'; };

                const infoDiv = document.createElement('div');
                infoDiv.className = 'summary-info';

                const h4 = document.createElement('h4');
                h4.textContent = item.name;

                const p = document.createElement('p');
                p.textContent = `الكمية: ${item.quantity} × ${item.price.toFixed(2)} ر.س`;

                infoDiv.appendChild(h4);
                infoDiv.appendChild(p);

                const strong = document.createElement('strong');
                strong.textContent = `${item.total.toFixed(2)} ر.س`;

                itemDiv.appendChild(img);
                itemDiv.appendChild(infoDiv);
                itemDiv.appendChild(strong);

                listEl.appendChild(itemDiv);
            });

            document.getElementById('vSubtotal').textContent = verifiedCheckoutData.subtotal.toFixed(2) + ' ر.س';
            document.getElementById('vShipping').textContent = verifiedCheckoutData.shipping === 0 ? 'مجاني (Free)' : verifiedCheckoutData.shipping.toFixed(2) + ' ر.س';
            
            const dRow = document.getElementById('vDiscountRow');
            if (verifiedCheckoutData.discount > 0 && verifiedCheckoutData.couponCode) {
                dRow.style.display = 'flex';
                document.getElementById('vCouponName').textContent = verifiedCheckoutData.couponCode;
                document.getElementById('vDiscount').textContent = '-' + verifiedCheckoutData.discount.toFixed(2) + ' ر.س';
            } else {
                dRow.style.display = 'none';
            }

            document.getElementById('vTotal').textContent = verifiedCheckoutData.total.toFixed(2) + ' ر.س';
        }

        async function submitSecureOrder() {
            const btn = document.getElementById('submitOrderBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري حفظ الطلب في الخادم الآمن...`;

            try {
                const nameInput = document.getElementById('customerName').value.trim();
                const phoneInput = document.getElementById('customerPhone').value.trim();
                const addressInput = document.getElementById('customerAddress').value.trim();

                if (!nameInput || !phoneInput || !addressInput) {
                    throw new Error("يرجى ملء كافة حقول التوصيل.");
                }

                const customerInfo = {
                    name: nameInput,
                    phone: phoneInput,
                    address: addressInput
                };

                const finalOrderPayload = {
                    items: verifiedCheckoutData.items,
                    subtotal: verifiedCheckoutData.subtotal,
                    shippingFee: verifiedCheckoutData.shipping,
                    discount: verifiedCheckoutData.discount,
                    couponCode: verifiedCheckoutData.couponCode,
                    totalAmount: verifiedCheckoutData.total,
                    customer: customerInfo,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    status: "pending",
                    market: "Saudi Arabia"
                };

                const docRef = await db.collection('orders').add(finalOrderPayload);

                // تنظيف الكوبون والسلة بالكامل بعد نجاح الطلب لمنع إعادة استخدامه بالخطأ
                localStorage.removeItem('parole_cart');
                localStorage.removeItem('parole_applied_coupon_code');

                alert("تم تقديم طلبك بنجاح! رقم الطلب: " + docRef.id);
                window.location.href = `success.html?order=${docRef.id}`;

            } catch (err) {
                console.error("Order submission error:", err);
                alert("فشل إتمام الطلب: " + err.message);
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-check-circle"></i> تأكيد وإرسال الطلب نهائياً`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            verifyAndLoadCheckout();
        });
    </script>
</body>
</html>
